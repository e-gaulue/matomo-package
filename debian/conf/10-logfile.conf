# Installed by matomo-vanilla-logfile. Duplicates the archiving run's output into
# /var/log/matomo/matomo-archive.log, which is where this repository's package used to
# put it, while leaving it in the journal as well.
#
# systemd cannot write to a file and the journal from one StandardOutput=, which takes a
# single destination, so the stream is duplicated with tee: the file gets one copy, and
# tee's own output goes to the journal as any service's does.
#
# A drop-in has to clear ExecStart before setting it, hence the empty assignment.
#
# /bin/bash and not /bin/sh, for one reason: without "set -o pipefail" the pipeline
# reports tee's exit status instead of php's, so a failed archiving run would look like a
# success and the unit would never be marked failed. Debian 13's dash honours pipefail,
# Debian 12's rejects it outright, and bash is Essential -- so naming it costs nothing.
#
# This file is in /usr/lib, not /etc: drop-ins there are read first, so your own under
# /etc/systemd/system/matomo.service.d/ still wins. If you keep one that sets ExecStart
# -- to add --url=, typically -- it replaces this line and the file stops being written.
# Put the tee into your own drop-in in that case; the line above is the one to copy.
[Service]
ExecStart=
ExecStart=/bin/bash -c 'set -o pipefail; exec /usr/bin/php /usr/share/matomo/console core:archive 2>&1 | tee -a /var/log/matomo/matomo-archive.log'
